spring:
  application:
    name: transaction-mock
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        "[max.block.ms]": 250
        "[request.timeout.ms]": 3000
        "[delivery.timeout.ms]": 5000
  grpc:
    client:
      channel:
        scoring:
          target: ${SCORING_GRPC_TARGET:static://localhost:9090}
          ssl:
            enabled: false

server:
  port: 8081

mock:
  runtime:
    # Стартовые параметры синтетического пула; seed сохраняет повторяемость профилей.
    user-pool-size: 10000
    mean-amount-minor: 2500
    seed: 42
    max-concurrent-scenarios: 16
    max-retained-runs: 256
    max-stream-in-flight: 256
  generation:
    # Разброс логарифма обычной суммы: больше sigma — тяжелее хвост крупных покупок.
    sigma: 0.75
    # Длительность легитимной поездки по часам мока.
    trip-duration: 30m
    # Доля захватов аккаунта с последующим крупным платежом, не общая доля фрода.
    account-takeover-large-payment-probability: 0.2

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
