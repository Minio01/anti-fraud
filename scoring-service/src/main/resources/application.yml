spring:
  application:
    name: scoring-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5ms
  grpc:
    server:
      port: 9090

server:
  port: 8090

# Порог правила суммы в центах USD (SPEC.md §7.1, R6).
scoring:
  amount-rule:
    threshold-minor: 10000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
