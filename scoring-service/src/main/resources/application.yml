spring:
  application:
    name: scoring-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        "[max.block.ms]": 1000
        "[request.timeout.ms]": 3000
        "[delivery.timeout.ms]": 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5ms
  grpc:
    server:
      port: 9090

server:
  port: 8090

scoring:
  redis:
    deadline: 5ms
    open-duration: 1s
  rules:
    velocity:
      min-count: 8
      weight: 0.5
    account-takeover:
      min-ratio: 3
      weight: 0.6
    card-testing:
      min-count: 5
      min-merchants: 3
      weight: 0.5
    amount-anomaly:
      min-ratio: 10
      weight: 0.4
    impossible-travel:
      min-speed-kmh: 900
      weight: 0.7
  amount-rule:
    # R6: 10 000 USD в центах.
    threshold-minor: 1000000
  decision:
    ml-weight: 0.90
    flag-threshold: 0.50
    block-threshold: 0.85
  ml:
    threads: 2
    queue-capacity: 64

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
