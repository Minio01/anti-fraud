syntax = "proto3";

package risk.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.antifraud.proto.v1";

// Канал, через который совершена транзакция.
enum Channel {
  CHANNEL_UNSPECIFIED = 0; // proto3: нулевое значение enum обязательно и означает «не задано»
  CHANNEL_ONLINE = 1;
  CHANNEL_POS = 2;
  CHANNEL_ATM = 3;
}

// Финансовая транзакция. Поля и правила валидации: SPEC.md, раздел 4.
message Transaction {
  string transaction_id = 1;
  string user_id = 2;
  int64 amount_minor = 3;
  string currency = 4;
  google.protobuf.Timestamp timestamp = 5;
  string merchant_id = 6;
  string merchant_category = 7;
  string device_id = 8;
  string ip = 9;
  string country = 10;
  optional double latitude = 11;
  optional double longitude = 12;
  Channel channel = 13;
  //`./gradlew :proto:build`
  // сгенерированный код в proto/build/generated/sources/proto/main/ (java, kotlin, grpc, grpckt).
}
